# JuiceFS on RustFS and Redis: the client writes a compressible file in
# appends and reads it back cold, to reproduce juicedata/juicefs#7555. The
# project ends when the client exits, because the machine runs compose with
# --abort-on-container-exit.
services:
  redis:
    image: redis:7.4.12-alpine
  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: jfsadmin
      RUSTFS_SECRET_KEY: jfssecret123
  jfs:
    image: jfs-client:local
    depends_on: [redis, rustfs]
    # A FUSE mount needs the device and SYS_ADMIN. Docker's default AppArmor
    # profile refuses mount(2) even with SYS_ADMIN, on a host that has it.
    devices: [/dev/fuse]
    cap_add: [SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    environment:
      ROUNDS: 5
