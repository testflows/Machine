# Bombadil's terminal examples in one service. The command is the time limit
# of each example and the examples to run; with none named, Bombadil's five
# run: cat, nano, tb, btop and tetris.
services:
  app:
    image: bombadil-examples:0.8.0
    build: .
    command: ["20s"]
    # TigerBeetle, which the tb example tests, does its I/O with io_uring,
    # and Docker's default seccomp profile refuses the io_uring calls.
    security_opt: [seccomp:unconfined]
